name: Geometry and export checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.4.2'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: bash scripts/test_geometry.sh
